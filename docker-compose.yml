version: '3.8'

services:
  # MySQL 服务 - 用于数据存储
  mysql:
    image: mysql:8.0
    container_name: lightdoc-mysql
    restart: unless-stopped
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: root123456
      MYSQL_DATABASE: light_doc
      MYSQL_USER: lightdoc
      MYSQL_PASSWORD: lightdoc123456
      TZ: Asia/Shanghai
    volumes:
      - mysql-data:/var/lib/mysql
      - ./db-structure.sql:/docker-entrypoint-initdb.d/01-structure.sql
      - ./db-data.sql:/docker-entrypoint-initdb.d/02-data.sql
    command: 
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-authentication-plugin=mysql_native_password
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p$$MYSQL_ROOT_PASSWORD"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - lightdoc-network

  # Redis 服务 - 用于缓存和会话管理
  redis:
    image: redis:7.0-alpine
    container_name: lightdoc-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3
    networks:
      - lightdoc-network

  # MinIO 服务 - 用于本地文件存储
  minio:
    image: docker.1ms.run/minio/minio:latest
    container_name: lightdoc-minio
    restart: unless-stopped
    ports:
      - "9000:9000"   # API端口
      - "9001:9001"   # 控制台端口
    environment:
      MINIO_ROOT_USER: admin
      MINIO_ROOT_PASSWORD: 12345678
    volumes:
      - minio-data:/data
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3
    networks:
      - lightdoc-network

volumes:
  mysql-data:
    driver: local
  redis-data:
    driver: local
  minio-data:
    driver: local

networks:
  lightdoc-network:
    driver: bridge
